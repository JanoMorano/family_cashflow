<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Přihlášení · Family Cashflow</title>
<script src="/js/app-version.js"></script>
<script src="/js/app-version-label.js"></script>
<style>
:root{--blue:#2563EB;--blue-d:#1E40AF;--red:#DC2626;--g50:#F9FAFB;--g100:#F3F4F6;--g200:#E5E7EB;--g400:#9CA3AF;--g600:#4B5563;--g800:#1F2937;}
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;display:grid;place-items:center;background:#EEF2FF;color:var(--g800);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:20px;}
.login{width:100%;max-width:380px;background:#fff;border-radius:12px;box-shadow:0 18px 60px rgba(30,64,175,.16);overflow:hidden;}
.top{background:linear-gradient(135deg,var(--blue-d),var(--blue));color:#fff;padding:24px;}
.top-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:6px;}
.lang-switcher{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;}
.lang-btn{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);color:#fff;border-radius:6px;padding:3px 6px;font-size:10px;font-weight:800;cursor:pointer;margin:0;line-height:1.2;}
.lang-btn.active,.lang-btn:hover{background:#fff;color:var(--blue-d);}
h1{font-size:22px;line-height:1.2;margin-bottom:6px;}
p{font-size:13px;opacity:.78;}
form{padding:22px 24px 24px;display:flex;flex-direction:column;gap:14px;}
label{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--g600);}
input{border:1px solid var(--g200);border-radius:8px;padding:10px 12px;font-size:15px;color:var(--g800);font-family:inherit;}
input:focus{outline:2px solid var(--blue);border-color:var(--blue);}
button{border:none;border-radius:8px;background:var(--blue);color:#fff;font-weight:800;font-size:14px;padding:11px 14px;cursor:pointer;margin-top:4px;}
button:hover{background:var(--blue-d);}
button:disabled{opacity:.65;cursor:wait;}
.err{display:none;background:#FEF2F2;color:var(--red);border:1px solid #FECACA;border-radius:8px;padding:9px 10px;font-size:13px;}
.hint{font-size:12px;color:var(--g400);line-height:1.45;margin-top:2px;}
.app-version{text-align:center;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--g400);padding:0 24px 18px;}
</style>
</head>
<body>
<main class="login">
  <div class="top">
    <div class="top-row">
      <h1>🏠 Family Cashflow</h1>
      <div class="lang-switcher">
        <button type="button" class="lang-btn" data-lang="cs" onclick="applyLang('cs')">CS</button>
        <button type="button" class="lang-btn" data-lang="en" onclick="applyLang('en')">EN</button>
        <button type="button" class="lang-btn" data-lang="sk" onclick="applyLang('sk')">SK</button>
        <button type="button" class="lang-btn" data-lang="de" onclick="applyLang('de')">DE</button>
        <button type="button" class="lang-btn" data-lang="pl" onclick="applyLang('pl')">PL</button>
      </div>
    </div>
    <p data-i18n="subtitle">Přihlášení pro společnou editaci rozpočtu.</p>
  </div>
  <form id="login-form">
    <div class="err" id="login-error" data-i18n="invalid">Neplatné jméno nebo heslo.</div>
    <label><span data-i18n="username">Uživatel</span>
      <input id="username" autocomplete="username" autofocus required>
    </label>
    <label><span data-i18n="password">Heslo</span>
      <input id="password" type="password" autocomplete="current-password" required>
    </label>
    <button id="submit-btn" data-i18n="submit">Přihlásit</button>
    <div class="hint" data-i18n="hint">Výchozí účty jsou <code>admin/admin</code> a <code>demo/demo</code>. Uživatelé se nastavují přes <strong>APP_USERS</strong>.</div>
  </form>
  <div class="app-version" data-app-version>Family Cashflow 1.1</div>
</main>
<script>
const LOGIN_LANG = {
  cs:{
    page_title:'Přihlášení · Family Cashflow',
    subtitle:'Přihlášení pro společnou editaci rozpočtu.',
    invalid:'Neplatné jméno nebo heslo.',
    username:'Uživatel',
    password:'Heslo',
    submit:'Přihlásit',
    hint:'Výchozí účty jsou <code>admin/admin</code> a <code>demo/demo</code>. Uživatelé se nastavují přes <strong>APP_USERS</strong>.',
  },
  en:{
    page_title:'Login · Family Cashflow',
    subtitle:'Sign in for shared budget editing.',
    invalid:'Invalid username or password.',
    username:'Username',
    password:'Password',
    submit:'Sign In',
    hint:'Default accounts are <code>admin/admin</code> and <code>demo/demo</code>. Users are configured through <strong>APP_USERS</strong>.',
  },
  sk:{
    page_title:'Prihlásenie · Family Cashflow',
    subtitle:'Prihlásenie pre spoločnú úpravu rozpočtu.',
    invalid:'Neplatné meno alebo heslo.',
    username:'Používateľ',
    password:'Heslo',
    submit:'Prihlásiť',
    hint:'Predvolené účty sú <code>admin/admin</code> a <code>demo/demo</code>. Používatelia sa nastavujú cez <strong>APP_USERS</strong>.',
  },
  de:{
    page_title:'Anmeldung · Family Cashflow',
    subtitle:'Anmelden, um das Budget gemeinsam zu bearbeiten.',
    invalid:'Ungültiger Benutzername oder ungültiges Passwort.',
    username:'Benutzer',
    password:'Passwort',
    submit:'Anmelden',
    hint:'Standardkonten sind <code>admin/admin</code> und <code>demo/demo</code>. Benutzer werden über <strong>APP_USERS</strong> konfiguriert.',
  },
  pl:{
    page_title:'Logowanie · Family Cashflow',
    subtitle:'Zaloguj się, aby wspólnie edytować budżet.',
    invalid:'Nieprawidłowa nazwa użytkownika lub hasło.',
    username:'Użytkownik',
    password:'Hasło',
    submit:'Zaloguj',
    hint:'Domyślne konta to <code>admin/admin</code> i <code>demo/demo</code>. Użytkowników konfiguruje się przez <strong>APP_USERS</strong>.',
  },
};
let currentLang=localStorage.getItem('lang')||'cs';
function tr(key){return LOGIN_LANG[currentLang]?.[key]??LOGIN_LANG.cs[key]??key;}
function applyLang(code){
  currentLang=LOGIN_LANG[code]?code:'cs';
  localStorage.setItem('lang',currentLang);
  document.documentElement.lang=currentLang;
  document.title=tr('page_title');
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.innerHTML=tr(el.dataset.i18n);});
  document.querySelectorAll('.lang-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.lang===currentLang));
}
applyLang(currentLang);
const params=new URLSearchParams(window.location.search);
const next=params.get('next')||'/';
fetch('/api/auth/me').then(r=>{if(r.ok)window.location.href=next;}).catch(()=>{});
document.getElementById('login-form').addEventListener('submit',async e=>{
  e.preventDefault();
  const err=document.getElementById('login-error');
  const btn=document.getElementById('submit-btn');
  err.style.display='none';
  btn.disabled=true;
  try{
    const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      username:document.getElementById('username').value.trim(),
      password:document.getElementById('password').value,
    })});
    if(!res.ok)throw new Error('login failed');
    window.location.href=next;
  }catch{
    err.style.display='block';
    btn.disabled=false;
  }
});
</script>
</body>
</html>
